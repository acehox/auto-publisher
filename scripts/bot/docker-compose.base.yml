# Shared service topology for the public (commercial) stack. Self-hosting uses
# the standalone docker-compose.yml at the repo root instead.
#
# Same topology as self-host — one bot, one proxy, one backend. The only thing
# `DEPLOYMENT_MODE=public` adds is billing, so these files differ from the root
# compose only in dev tooling, resource limits and the mail catcher.
#
# NOTE: no `env_file` here on purpose. Compose APPENDS env_file lists across
# `-f` layers, so declaring it in this base made every prod service load the
# dev env file first and silently inherit any value prod did not re-declare.
# Each overlay (dev/, prod/) declares its own.
services:
  proxy:
    build:
      context: ../..
      dockerfile: apps/proxy/Dockerfile
    restart: unless-stopped
    networks:
      - ap-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  bot:
    build:
      context: ../..
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    networks:
      - ap-network
    depends_on:
      proxy:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    networks:
      - ap-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      # Loopback-bound deliberately: a bare `6379:6379` publishes on every interface,
      # exposing an unauthenticated Redis to the dev machine's network. Compose services
      # reach Redis by service name, so this mapping is only for host tooling.
      - 127.0.0.1:6379:6379
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --port 6379
      --appendonly yes
      --appendfsync everysec
    networks:
      - ap-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  ap-network:
    driver: bridge
    internal: false  # Allow external access for Discord API

volumes:
  redis_data:
    driver: local
