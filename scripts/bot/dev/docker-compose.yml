name: auto-publisher-dev

# Any subset can be started: `backend` alone is enough for web/checkout work,
# `bot` pulls in proxy + backend + redis (the full publishing loop).

x-dev-watch-proxy: &dev-watch-proxy
  - action: sync+restart
    path: ../../apps/proxy/src
    target: /app/apps/proxy/src
    ignore:
      - "**/*.test.ts"
      - "**/*.spec.ts"
  - action: sync+restart
    path: ../../packages
    target: /app/packages
    ignore:
      - "**/node_modules/"
      - "**/dist/"
      - "**/*.test.ts"
      - "**/*.spec.ts"
  - action: rebuild
    path: ../../apps/proxy/package.json
  - action: rebuild
    path: ../../package.json
  - action: rebuild
    path: ../../bun.lock

x-dev-watch-bot: &dev-watch-bot
  - action: sync+restart
    path: ../../apps/bot/src
    target: /app/apps/bot/src
    ignore:
      - "**/*.test.ts"
      - "**/*.spec.ts"
  - action: sync+restart
    path: ../../packages
    target: /app/packages
    ignore:
      - "**/node_modules/"
      - "**/dist/"
      - "**/*.test.ts"
      - "**/*.spec.ts"
  - action: rebuild
    path: ../../apps/bot/package.json
  - action: rebuild
    path: ../../package.json
  - action: rebuild
    path: ../../bun.lock

services:
  proxy:
    extends:
      file: docker-compose.base.yml
      service: proxy
    build:
      dockerfile: apps/proxy/Dockerfile.dev
    env_file:
      - ../../.env.local
    environment:
      - NODE_ENV=development
      - LOGGER_LEVEL=debug
    depends_on:
      redis:
        condition: service_started
    ports:
      - 8081:8080 # Expose proxy for local debugging
    healthcheck:
      disable: true # Remove healthcheck for faster development startup
    command: ["bun", "run", "start"]
    develop:
      watch: *dev-watch-proxy

  bot:
    extends:
      file: docker-compose.base.yml
      service: bot
    build:
      dockerfile: apps/bot/Dockerfile.dev
    env_file:
      - ../../.env.local
    environment:
      - NODE_ENV=development
      - LOGGER_LEVEL=debug
    depends_on:
      proxy:
        condition: service_started
      backend:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      disable: true # Remove healthcheck for faster development startup
    command: ["bun", "run", "start"]
    develop:
      watch: *dev-watch-bot

  backend:
    extends:
      file: docker-compose.base.yml
      service: backend
    build:
      dockerfile: apps/backend/Dockerfile.dev
    env_file:
      - ../../.env.local
    environment:
      - NODE_ENV=development
      - LOGGER_LEVEL=debug
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USER=dev
      - SMTP_PASSWORD=dev
    depends_on:
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    ports:
      - 3101:8080 # Expose API for local development
    healthcheck:
      disable: true # Remove healthcheck for faster development startup
    command: ["bun", "run", "start"]
    develop:
      watch:
        - action: sync+restart
          path: ../../apps/backend/src
          target: /app/apps/backend/src
          ignore:
            - "**/*.test.ts"
            - "**/*.spec.ts"
        - action: sync+restart
          path: ../../packages
          target: /app/packages
          ignore:
            - "**/node_modules/"
            - "**/dist/"
            - "**/*.test.ts"
            - "**/*.spec.ts"
        - action: rebuild
          path: ../../apps/backend/package.json
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../bun.lock

  # Catches the one email the stack sends (the statutory withdrawal acknowledgement).
  # Dev overlay only: prod uses a real provider, and self-host has no withdrawal routes.
  mailpit:
    image: axllent/mailpit:v1.30.7
    restart: unless-stopped
    environment:
      # Both are load-bearing: the backend always authenticates (SMTP_USER/SMTP_PASSWORD
      # are what enable sending at all), and nodemailer sends AUTH LOGIN in the clear on
      # 1025 — Mailpit refuses that without these two.
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    networks:
      - ap-network
    ports:
      # Loopback-bound like redis: this is an open relay with an open inbox.
      - 127.0.0.1:1025:1025 # SMTP, for host-side scripts
      - 127.0.0.1:8025:8025 # Web UI + REST API
    healthcheck:
      disable: true # Remove healthcheck for faster development startup

  redis:
    extends:
      file: docker-compose.base.yml
      service: redis
