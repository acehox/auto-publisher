name: auto-publisher-prod

x-prod-logging: &prod-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-proxy-resources: &proxy-resources
  resources:
    limits:
      memory: 768M
      cpus: '0.75'
    reservations:
      memory: 384M
      cpus: '0.375'

x-bot-resources: &bot-resources
  resources:
    limits:
      memory: 1G
      cpus: '1.0'
    reservations:
      memory: 512M
      cpus: '0.5'

services:
  redis:
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save 900 1
      --save 300 10
      --save 60 10000
    logging: *prod-logging

  proxy:
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=production
      - LOGGER_LEVEL=info
    logging: *prod-logging
    deploy: *proxy-resources

  backend:
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=production
      - LOGGER_LEVEL=info
    logging: *prod-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  bot:
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=production
      - LOGGER_LEVEL=info
    logging: *prod-logging
    deploy: *bot-resources

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Server-side only; the browser never calls the backend directly.
      - BACKEND_URL=http://backend:8080
      - NODE_ENV=production
    ports:
      - 127.0.0.1:3100:3100
    networks:
      - ap-network
    depends_on:
      backend:
        condition: service_healthy
    logging: *prod-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
