name: auto-publisher-prod

# Services loading ../../.env blank `TUNNEL_TOKEN` (`environment` beats
# `env_file`): whoever reads the token can run a connector and take live traffic.

x-prod-logging: &prod-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-proxy-resources: &proxy-resources
  resources:
    limits:
      memory: 768M
      cpus: '0.75'
    reservations:
      memory: 384M
      cpus: '0.375'

# Sized for ~12k guilds: every guild's channels and roles stay cached for permission checks.
# 1G was OOM-killed (exit 137) mid-startup at 12 shards on the 4G production VPS.
x-bot-resources: &bot-resources
  resources:
    limits:
      memory: 2560M
      cpus: '1.0'
    reservations:
      memory: 1G
      cpus: '0.5'

services:
  redis:
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save 900 1
      --save 300 10
      --save 60 10000
    logging: *prod-logging

  proxy:
    env_file:
      - ../../.env
    environment:
      - TUNNEL_TOKEN=
      - NODE_ENV=production
      - LOGGER_LEVEL=info
    logging: *prod-logging
    deploy: *proxy-resources

  backend:
    env_file:
      - ../../.env
    environment:
      - TUNNEL_TOKEN=
      - NODE_ENV=production
      - LOGGER_LEVEL=info
    networks:
      - ap-network
      - ap-edge
    logging: *prod-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  bot:
    env_file:
      - ../../.env
    environment:
      - TUNNEL_TOKEN=
      - NODE_ENV=production
      - LOGGER_LEVEL=info
    logging: *prod-logging
    deploy: *bot-resources

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Server-side only; the browser never calls the backend directly.
      - BACKEND_URL=http://backend:8080
      - TUNNEL_TOKEN=
      - NODE_ENV=production
    ports:
      - 127.0.0.1:3100:3100
    networks:
      - ap-network
      - ap-edge
    depends_on:
      backend:
        condition: service_healthy
    logging: *prod-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Sole public ingress; routes live in the Cloudflare dashboard.
  # See docs/public-instance/billing-paddle-setup.md "Webhook ingress".
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    # The default metrics bind is 0.0.0.0, serving /config and pprof to the network.
    command: tunnel --metrics 127.0.0.1:20241 --management-diagnostics=false run
    restart: unless-stopped
    # Interpolated (`--env-file`), not env_file, so no other secret lands here.
    # Presence is checked in prod/start.sh: `:?` would also block prod:stop.
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # ap-edge only: no route to redis, proxy or bot.
    networks:
      - ap-edge
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *prod-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

networks:
  ap-edge:
    driver: bridge
